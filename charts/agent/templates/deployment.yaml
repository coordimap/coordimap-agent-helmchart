{{- if not .Values.apiKey }}
{{ fail "apiKey is required. Please set the apiKey value in values.yaml" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coordimap.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-agent
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-agent
        {{- include "coordimap.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      containers:
        - name: {{ .Release.Name }}-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "/agent"
          args:
            - "--debug={{ .Values.debug }}"
            - "--config"
            - "/config.yaml"
            - "--endpoint"
            - "{{ .Values.endpoint }}"
          env:
            - name: COORDIMAP_API_KEY
              value: "{{ .Values.apiKey }}"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - mountPath: /config.yaml
              subPath: config.yaml
              name: coordimap-config-file
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: coordimap-config-file
          configMap:
            name: {{ .Release.Name }}-config
            items:
              - key: config.yaml
                path: config.yaml

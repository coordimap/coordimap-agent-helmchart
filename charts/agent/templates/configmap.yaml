{{- include "coordimap.datasource.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coordimap.labels" . | nindent 4 }}
data:
  config.yaml: |-
    coordimap:
      api_key: ${COORDIMAP_API_KEY}
      skip_fields:
{{- toYaml (.Values.skipFields | default list) | nindent 8 }}
      data_sources:
{{- if .Values.dataSources }}
{{- range $source := .Values.dataSources }}
{{- if not $source.type }}
{{- fail "Each data source requires a type" }}
{{- end }}
{{- if not $source.id }}
{{- fail "Each data source requires an id" }}
{{- end }}
{{- if not $source.config }}
{{- fail (printf "Data source %s requires a config array" $source.id) }}
{{- end }}
{{- $hasCamelMetricRules := hasKey $source "metricRules" }}
{{- $metricRules := $source.metric_rules }}
{{- if $hasCamelMetricRules }}
{{- $metricRules = $source.metricRules }}
{{- end }}
        - type: {{ $source.type }}
          id: {{ $source.id | quote }}
          config:
{{- range $entry := $source.config }}
{{- if eq $entry.name "crawl_interval" }}
{{- if not (regexMatch "^[0-9]+[smh]$" (printf "%v" $entry.value)) }}
{{- fail (printf "Invalid crawl_interval for data source %s. Value must end with 's', 'm' or 'h'. Value is: %v" $source.id $entry.value) }}
{{- end }}
{{- end }}
            - name: {{ $entry.name }}
              value: {{ $entry.value | quote }}
{{- end }}
{{- if $metricRules }}
          metric_rules:
{{- range $rule := $metricRules }}
            - id: {{ $rule.id | quote }}
              name: {{ $rule.name | quote }}
              provider: {{ $rule.provider | quote }}
              mode: {{ $rule.mode | quote }}
{{- if $rule.custom }}
              custom:
{{ toYaml $rule.custom | nindent 16 }}
{{- end }}
{{- if $rule.predefined }}
              predefined:
{{ toYaml $rule.predefined | nindent 16 }}
{{- end }}
{{- if $rule.lookback }}
              lookback: {{ $rule.lookback | quote }}
{{- end }}
{{- if $rule.threshold }}
              threshold:
{{ toYaml $rule.threshold | nindent 16 }}
{{- end }}
{{- if $rule.target }}
              target:
{{ toYaml $rule.target | nindent 16 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- else }}
        []
{{- end }}

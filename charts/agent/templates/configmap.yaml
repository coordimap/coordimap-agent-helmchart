{{- include "coordimap.datasource.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |-
    coordimap:
      api_key: ${COORDIMAP_API_KEY}
      data_sources:
{{- if .Values.dataSources }}
{{- range $source := .Values.dataSources }}
{{- if not $source.type }}
{{- fail "Each data source requires a type" }}
{{- end }}
{{- if not $source.name }}
{{- fail "Each data source requires a name" }}
{{- end }}
{{- if not $source.config }}
{{- fail (printf "Data source %s requires a config array" $source.name) }}
{{- end }}
        - type: {{ $source.type }}
          name: {{ $source.name | quote }}
{{- if hasKey $source "desc" }}
          desc: {{ $source.desc | quote }}
{{- end }}
          config:
{{- range $entry := $source.config }}
{{- if eq $entry.name "crawl_interval" }}
{{- if not (regexMatch "^[0-9]+[smh]$" (printf "%v" $entry.value)) }}
{{- fail (printf "Invalid crawl_interval for data source %s. Value must end with 's', 'm' or 'h'. Value is: %v" $source.name $entry.value) }}
{{- end }}
{{- end }}
            - name: {{ $entry.name }}
              value: {{ $entry.value | quote }}
{{- end }}
{{- end }}
{{- else }}
        []
{{- end }}

# Default values for Coordimap Agent.

image:
  repository: coordimap/coordimap-agent
  tag: latest
  pullPolicy: Always

resources:
  requests:
    memory: "150M"
    cpu: "500m"
    ephemeral-storage: "15Mi"
  limits:
    memory: "150M"
    cpu: "500m"
    ephemeral-storage: "15Mi"

# Service account configuration used by the deployment and RBAC binding.
# Set create=false to use an existing service account.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Extra labels applied to all rendered resources and pods.
commonLabels: {}
#  environment: production
#  team: platform
#  app.kubernetes.io/part-of: coordimap

# API configuration
apiKey: "your-api-key-here"
endpoint: "https://api.coordimap.com/collector/crawlers/infra"
# Enable the agent debug CLI flag. When false, the flag is omitted.
debug: true

# Extra environment variables for the agent container.
# Each item is rendered directly into the container env list.
extraEnv: []
#  - name: LOG_LEVEL
#    value: info
#  - name: POSTGRES_PASSWORD
#    valueFrom:
#      secretKeyRef:
#        name: postgres-secret
#        key: password

# Upstream-native Coordimap Agent data source configuration.
# Each item maps directly to an entry under coordimap.data_sources.
# Use the data source id from the Coordimap UI; name and desc are not supported.
# Metric trigger rules are supported on kubernetes and gcp sources via
